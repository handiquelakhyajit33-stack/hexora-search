[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[functions."crawl-scheduled"]
  schedule = "0 */2 * * *"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/seed"
  to = "/.netlify/functions/seed"
  status = 200
