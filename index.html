<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
  name="description"
  content="HEXORA — Search the World"
>

<title>HEXORA — Search the World</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#020914;
  --panel:rgba(5,21,35,.90);
  --cyan:#00eaff;
  --cyan2:#16cfff;
  --text:#f4fbff;
  --muted:#8fa7b8;
  --border:rgba(0,229,255,.22);
}

html,
body{
  width:100%;
  min-height:100%;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(0,210,255,.13),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

body{
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  height:74px;
  padding:0 32px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(2,9,20,.88);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:210px;
}

.logo-icon{
  width:45px;
  height:45px;

  display:grid;
  place-items:center;

  border:2px solid var(--cyan);
  border-radius:13px;

  color:var(--cyan);
  font-size:25px;
  font-weight:900;

  box-shadow:
    0 0 20px rgba(0,234,255,.2);
}

.logo-text{
  font-size:27px;
  font-weight:900;
  letter-spacing:1px;
}

.logo-text span{
  color:var(--cyan);
}

.logo-sub{
  display:block;
  margin-top:-3px;

  color:#b5c8d5;
  font-size:8px;
  letter-spacing:4px;
}

.nav{
  display:flex;
  align-items:center;
  gap:8px;
}

.nav button{
  border:0;
  background:transparent;
  color:#c5d5df;

  padding:12px 16px;
  border-radius:12px;

  font-size:14px;
}

.nav button:hover,
.nav button.active{
  color:var(--cyan);
  background:rgba(0,234,255,.08);
}

.menu-btn{
  display:none;

  width:43px;
  height:43px;

  border:1px solid var(--border);
  border-radius:50%;

  background:transparent;
  color:var(--cyan);

  font-size:22px;
}

/* ================= HERO ================= */

.hero{
  position:relative;

  min-height:500px;
  padding:70px 20px 30px;

  overflow:hidden;

  text-align:center;
}

.hero::after{
  content:"";

  position:absolute;

  left:50%;
  bottom:-300px;

  transform:translateX(-50%);

  width:1200px;
  height:500px;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(0,225,255,.35),
      rgba(0,100,180,.08) 45%,
      transparent 70%
    );

  border-top:2px solid rgba(0,238,255,.7);

  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;

  max-width:1100px;
  margin:auto;
}

.hero-title{
  font-size:clamp(45px,8vw,82px);

  font-weight:950;
  letter-spacing:3px;

  text-shadow:
    0 0 35px rgba(0,234,255,.3);
}

.hero-title span{
  color:var(--cyan);
}

.hero-sub{
  margin-top:5px;

  color:#c5d8e4;
  font-size:13px;
  letter-spacing:7px;
}

/* ================= SEARCH ================= */

.search-box{
  width:min(850px,100%);
  margin:35px auto 20px;

  display:flex;

  border:1.5px solid var(--cyan);
  border-radius:50px;

  overflow:hidden;

  background:rgba(2,16,28,.92);

  box-shadow:
    0 0 35px rgba(0,234,255,.12);
}

.search-box input{
  flex:1;
  min-width:0;

  border:0;
  outline:0;

  background:transparent;
  color:white;

  padding:20px 25px;

  font-size:16px;
}

.search-box input::placeholder{
  color:#7791a2;
}

.search-btn{
  width:78px;

  border:0;

  background:var(--cyan);
  color:#00131b;

  font-size:23px;
  font-weight:900;
}

.search-btn:hover{
  background:#68f5ff;
}

/* ================= MODES ================= */

.modes{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;

  position:relative;
  z-index:3;
}

.mode{
  border:1px solid rgba(0,234,255,.4);

  background:rgba(4,25,40,.85);
  color:#d9edf6;

  padding:11px 19px;

  border-radius:30px;

  font-size:13px;
}

.mode:hover,
.mode.active{
  color:#00131b;
  background:var(--cyan);
}

/* ================= TRENDING ================= */

.trending{
  position:relative;
  z-index:4;

  margin:28px auto 0;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;

  max-width:1000px;
}

.trending-title{
  width:100%;
  margin-bottom:5px;

  color:var(--cyan);
  font-weight:700;
}

.trend{
  padding:8px 15px;

  border-radius:20px;

  background:rgba(0,234,255,.06);
  border:1px solid rgba(0,234,255,.2);

  color:#b8ced9;
  font-size:12px;
}

.trend:hover{
  color:var(--cyan);
  border-color:var(--cyan);
}

/* ================= CONTENT ================= */

.content{
  position:relative;
  z-index:10;

  max-width:1450px;
  margin:-20px auto 50px;

  padding:0 25px;

  display:grid;

  grid-template-columns:
    minmax(250px,.95fr)
    minmax(350px,1.25fr)
    minmax(250px,.95fr);

  gap:18px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(8,32,49,.95),
      rgba(3,15,27,.95)
    );

  border:1px solid var(--border);
  border-radius:17px;

  overflow:hidden;

  box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:17px 18px;

  border-bottom:1px solid rgba(255,255,255,.06);
}

.card-head h2{
  font-size:17px;
}

.card-head button,
.card-head span{
  color:var(--cyan);
  font-size:12px;

  background:transparent;
  border:0;
}

/* ================= REAL NEWS ================= */

.news-list{
  min-height:100px;
}

.news-loading,
.news-empty{
  padding:30px 18px;

  color:var(--muted);

  font-size:12px;
  text-align:center;
}

.news-item{
  display:flex;
  gap:12px;

  padding:13px 17px;

  border-bottom:1px solid rgba(255,255,255,.06);
}

.news-item:last-child{
  border-bottom:0;
}

.news-img{
  width:90px;
  height:65px;

  flex-shrink:0;

  border-radius:9px;

  object-fit:cover;

  background:
    linear-gradient(
      135deg,
      #073a53,
      #05121d
    );
}

.news-source{
  color:var(--cyan);
  font-size:10px;
}

.news-title{
  margin-top:5px;

  font-size:13px;
  line-height:1.35;
}

.news-title a{
  text-decoration:none;
}

.news-title a:hover{
  color:var(--cyan);
}

.news-time{
  margin-top:5px;

  color:var(--muted);
  font-size:10px;
}

/* ================= FEATURE ================= */

.feature{
  min-height:350px;

  position:relative;

  background:
    radial-gradient(
      circle at 25% 25%,
      rgba(0,234,255,.23),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 20%,
      rgba(0,100,255,.18),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #06253a,
      #020d18
    );
}

.feature::before{
  content:"HEXORA";

  position:absolute;

  right:-30px;
  top:35px;

  font-size:70px;
  font-weight:950;

  color:rgba(0,234,255,.045);

  transform:rotate(-10deg);
}

.feature-content{
  position:absolute;

  bottom:0;
  left:0;
  right:0;

  padding:25px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.8)
    );
}

.badge{
  display:inline-block;

  padding:7px 12px;

  background:var(--cyan);
  color:#00131b;

  border-radius:8px;

  font-size:11px;
  font-weight:900;
}

.feature h2{
  margin-top:12px;

  font-size:23px;
}

.feature p{
  margin-top:7px;

  color:#c2d4dd;
  font-size:13px;
}

/* ================= MAP CARD ================= */

.map-preview{
  margin:12px;

  height:220px;

  border-radius:13px;

  overflow:hidden;

  position:relative;

  background:#071723;
}

#mapPreview{
  width:100%;
  height:100%;
}

.map-open{
  position:absolute;

  right:12px;
  bottom:12px;

  z-index:10;

  border:1px solid var(--cyan);

  background:rgba(2,9,20,.9);

  color:var(--cyan);

  padding:9px 13px;

  border-radius:10px;

  font-size:10px;
}

/* ================= QUICK ================= */

.quick-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  padding:12px;
}

.quick{
  min-height:80px;

  border:1px solid rgba(0,234,255,.16);
  border-radius:12px;

  background:rgba(0,234,255,.035);

  padding:13px;

  color:white;

  text-align:left;
}

.quick:hover{
  border-color:var(--cyan);
  background:rgba(0,234,255,.08);
}

.quick-icon{
  color:var(--cyan);
  font-size:21px;
}

.quick strong{
  display:block;
  margin-top:7px;

  font-size:12px;
}

.quick small{
  color:var(--muted);
  font-size:10px;
}

/* ================= SEARCH RESULTS ================= */

#searchView{
  display:none;

  width:min(1000px,92%);

  margin:0 auto;

  padding:25px 0 70px;
}

#searchView.active{
  display:block;
}

.result-meta{
  color:var(--muted);

  font-size:11px;

  margin-bottom:15px;
}

.result{
  padding:20px 0;

  border-bottom:1px solid rgba(255,255,255,.08);
}

.result h2{
  font-size:19px;

  margin-bottom:6px;
}

.result h2 a{
  color:#6cefff;
  text-decoration:none;
}

.result h2 a:hover{
  text-decoration:underline;
}

.result-url{
  color:#6f8998;

  font-size:10px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result-description{
  margin-top:8px;

  color:#9fb2bf;

  font-size:12px;

  line-height:1.6;
}

.result-image{
  width:105px;
  height:75px;

  float:right;

  margin-left:15px;

  border-radius:10px;

  object-fit:cover;
}

.empty{
  padding:55px 20px;

  text-align:center;

  color:var(--muted);

  border:1px dashed rgba(0,234,255,.16);

  border-radius:16px;
}

/* ================= MAP VIEW ================= */

#mapView{
  display:none;

  position:relative;

  width:100%;

  min-height:700px;

  border-top:1px solid var(--border);

  background:#061019;
}

#mapView.active{
  display:block;
}

#hexoraMap{
  width:100%;
  height:700px;
}

.map-search-panel{
  position:absolute;

  z-index:50;

  top:16px;
  left:50%;

  transform:translateX(-50%);

  width:min(700px,92%);

  display:flex;

  padding:6px;

  border:1px solid rgba(0,234,255,.3);

  border-radius:15px;

  background:rgba(2,9,20,.92);

  backdrop-filter:blur(15px);
}

.map-search-panel input{
  flex:1;

  min-width:0;

  border:0;
  outline:0;

  background:transparent;

  color:white;

  padding:12px;

  font-size:13px;
}

.map-search-panel button{
  border:0;

  border-radius:10px;

  padding:0 15px;

  background:var(--cyan);

  color:#00131b;

  font-weight:800;

  font-size:11px;
}

.map-tools{
  position:absolute;

  z-index:50;

  left:16px;
  bottom:20px;

  display:flex;
  flex-direction:column;
  gap:7px;
}

.map-tools button{
  min-width:130px;

  padding:11px 13px;

  border-radius:11px;

  border:1px solid rgba(0,234,255,.25);

  background:rgba(2,9,20,.9);

  color:#e6faff;

  font-size:10px;

  text-align:left;
}

.map-tools button:hover{
  border-color:var(--cyan);
  color:var(--cyan);
}

.map-info{
  display:none;

  position:absolute;

  z-index:50;

  right:16px;
  bottom:20px;

  max-width:330px;

  padding:15px;

  border-radius:13px;

  background:rgba(2,9,20,.94);

  border:1px solid var(--border);

  font-size:11px;

  line-height:1.5;
}

.map-info.show{
  display:block;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .header{
    height:65px;
    padding:0 15px;
  }

  .logo{
    min-width:auto;
  }

  .logo-text{
    font-size:21px;
  }

  .logo-icon{
    width:39px;
    height:39px;
  }

  .logo-sub{
    font-size:6px;
    letter-spacing:3px;
  }

  .nav{
    display:none;
  }

  .menu-btn{
    display:block;
  }

  .hero{
    min-height:auto;
    padding:48px 14px 25px;
  }

  .hero-title{
    font-size:46px;
  }

  .hero-sub{
    font-size:8px;
    letter-spacing:4px;
  }

  .search-box{
    margin-top:25px;
  }

  .search-box input{
    padding:16px;
    font-size:14px;
  }

  .search-btn{
    width:58px;
  }

  .modes{
    justify-content:flex-start;

    overflow-x:auto;
    flex-wrap:nowrap;

    padding:5px 2px 8px;

    scrollbar-width:none;
  }

  .modes::-webkit-scrollbar{
    display:none;
  }

  .mode{
    flex-shrink:0;
    padding:9px 14px;
  }

  .trending{
    justify-content:flex-start;

    overflow-x:auto;
    flex-wrap:nowrap;

    padding-bottom:5px;

    scrollbar-width:none;
  }

  .trending::-webkit-scrollbar{
    display:none;
  }

  .trending-title{
    display:none;
  }

  .trend{
    flex-shrink:0;
  }

  .content{
    margin-top:0;

    padding:0 12px;

    display:flex;
    flex-direction:column;

    gap:13px;
  }

  .feature{
    min-height:270px;
    order:-1;
  }

  .news-img{
    width:75px;
    height:57px;
  }

  .feature h2{
    font-size:19px;
  }

  #hexoraMap{
    height:620px;
  }

  .map-tools{
    left:10px;
    bottom:10px;
  }

  .map-tools button{
    min-width:auto;

    width:46px;
    height:46px;

    padding:0;

    border-radius:50%;

    display:grid;
    place-items:center;
  }

  .map-tools button span{
    display:none;
  }

  .map-info{
    left:10px;
    right:10px;
    bottom:10px;
  }

}

@media(max-width:480px){

  .logo-text{
    font-size:18px;
  }

  .logo-icon{
    width:35px;
    height:35px;
  }

  .hero{
    padding-top:38px;
  }

  .hero-title{
    font-size:40px;
  }

  .search-box{
    height:52px;
  }

  .search-box input{
    padding:14px;
    font-size:13px;
  }

  .search-btn{
    width:52px;
  }

  .feature{
    min-height:250px;
  }

  .quick-grid{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>


<body>

<header class="header">

  <div class="logo">

    <div class="logo-icon">H</div>

    <div>
      <div class="logo-text">
        HEX<span>ORA</span>
      </div>

      <small class="logo-sub">
        SEARCH THE WORLD
      </small>
    </div>

  </div>


  <nav class="nav">

    <button class="active" data-nav="home">
      ⌂ Home
    </button>

    <button data-nav="web">
      ◎ Web
    </button>

    <button data-nav="images">
      ▣ Images
    </button>

    <button data-nav="news">
      ▤ News
    </button>

    <button data-nav="maps">
      ⌖ Maps
    </button>

    <button data-nav="more">
      ⋮ More
    </button>

  </nav>


  <button
    class="menu-btn"
    id="menuBtn"
    type="button"
  >
    ☰
  </button>

</header>


<section class="hero" id="hero">

  <div class="hero-content">

    <h1 class="hero-title">
      HEX<span>ORA</span>
    </h1>

    <div class="hero-sub">
      SEARCH THE WORLD
    </div>


    <form
      class="search-box"
      id="searchForm"
    >

      <input
        id="searchInput"
        type="search"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search anything..."
      >

      <button
        class="search-btn"
        type="submit"
        aria-label="Search"
      >
        ⌕
      </button>

    </form>


    <div class="modes">

      <button class="mode active" data-mode="web">
        ◉ Web
      </button>

      <button class="mode" data-mode="images">
        ▧ Images
      </button>

      <button class="mode" data-mode="news">
        ▤ News
      </button>

      <button class="mode" data-mode="maps">
        ⌖ Maps
      </button>

      <button class="mode" data-mode="videos">
        ▶ Videos
      </button>

      <button class="mode" data-mode="shopping">
        🛍 Shopping
      </button>

    </div>


    <div class="trending">

      <div class="trending-title">
        ↗ Trending Searches
      </div>

      <button class="trend">
        Assam news
      </button>

      <button class="trend">
        India vs Australia
      </button>

      <button class="trend">
        Python tutorial
      </button>

      <button class="trend">
        AI tools
      </button>

      <button class="trend">
        Travel Assam
      </button>

      <button class="trend">
        Education
      </button>

      <button class="trend">
        Cricket
      </button>

    </div>

  </div>

</section>


<main
  class="content"
  id="homeContent"
>


  <!-- REAL NEWS -->

  <section class="card">

    <div class="card-head">

      <h2>
        ▤ Latest News
      </h2>

      <button
        type="button"
        id="viewNewsBtn"
      >
        View all →
      </button>

    </div>

    <div
      id="newsList"
      class="news-list"
    >

      <div class="news-loading">
        Loading real indexed news...
      </div>

    </div>

  </section>


  <!-- HEXORA DISCOVERY -->

  <section class="card feature">

    <div class="feature-content">

      <span class="badge">
        HEXORA
      </span>

      <h2>
        Explore the world with HEXORA
      </h2>

      <p>
        Search webpages, discover information,
        explore places and find real indexed content.
      </p>

    </div>

  </section>


  <!-- MAP + QUICK -->

  <section>

    <div class="card">

      <div class="card-head">

        <h2>
          ⌖ World Map
        </h2>

        <button
          type="button"
          id="openMapBtn"
        >
          Explore →
        </button>

      </div>


      <div class="map-preview">

        <div id="mapPreview"></div>

        <button
          class="map-open"
          id="mapPreviewBtn"
          type="button"
        >
          Open HEXORA Map
        </button>

      </div>

    </div>


    <div
      class="card"
      style="margin-top:13px;"
    >

      <div class="card-head">

        <h2>
          ⚡ Quick Actions
        </h2>

      </div>


      <div class="quick-grid">

        <button
          class="quick"
          data-quick="location"
          type="button"
        >

          <div class="quick-icon">
            ⌖
          </div>

          <strong>
            Current Location
          </strong>

          <small>
            Get your device location
          </small>

        </button>


        <button
          class="quick"
          data-quick="place"
          type="button"
        >

          <div class="quick-icon">
            ⌕
          </div>

          <strong>
            Place Search
          </strong>

          <small>
            Find a real place
          </small>

        </button>


        <button
          class="quick"
          data-quick="directions"
          type="button"
        >

          <div class="quick-icon">
            ➤
          </div>

          <strong>
            Directions
          </strong>

          <small>
            Explore map routes
          </small>

        </button>


        <button
          class="quick"
          data-quick="satellite"
          type="button"
        >

          <div class="quick-icon">
            ▱
          </div>

          <strong>
            Satellite View
          </strong>

          <small>
            Real imagery when configured
          </small>

        </button>

      </div>

    </div>

  </section>

</main>


<!-- SEARCH RESULTS -->

<section
  id="searchView"
>

  <div
    id="resultMeta"
    class="result-meta"
  ></div>

  <div id="results"></div>

</section>


<!-- MAP -->

<section
  id="mapView"
>

  <div class="map-search-panel">

    <input
      id="mapSearchInput"
      type="search"
      autocomplete="off"
      placeholder="Search a place..."
    >

    <button
      id="mapSearchBtn"
      type="button"
    >
      Search
    </button>

  </div>


  <div id="hexoraMap"></div>


  <div class="map-tools">

    <button
      id="locateBtn"
      type="button"
    >
      ⌖ <span>My Location</span>
    </button>

    <button
      id="resetMapBtn"
      type="button"
    >
      ↺ <span>Reset</span>
    </button>

    <button
      id="fullscreenMapBtn"
      type="button"
    >
      ⛶ <span>Fullscreen</span>
    </button>

  </div>


  <div
    id="mapInfo"
    class="map-info"
  ></div>

</section>
