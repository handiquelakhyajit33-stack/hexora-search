<script>

const queryInput =
  document.getElementById("query");

const results =
  document.getElementById("results");

const resultList =
  document.getElementById("resultList");

const resultsHeader =
  document.getElementById("resultsHeader");


/* =========================
   CURRENT SEARCH MODE
========================= */

let currentMode = "web";


/* =========================
   QUICK SEARCH
========================= */

function quickSearch(text) {

  queryInput.value = text;

  performSearch();

}


/* =========================
   CHANGE SEARCH MODE
========================= */

function setMode(button) {

  document
    .querySelectorAll(".category")
    .forEach(item => {

      item.classList.remove("active");

    });

  button.classList.add("active");


  const text =
    button.textContent.toLowerCase();


  if (text.includes("images")) {

    currentMode = "images";

  }

  else if (text.includes("news")) {

    currentMode = "news";

  }

  else if (text.includes("maps")) {

    currentMode = "maps";

  }

  else if (text.includes("videos")) {

    currentMode = "videos";

  }

  else {

    currentMode = "web";

  }

}


/* =========================
   ENTER KEY SEARCH
========================= */

queryInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      performSearch();

    }

  }
);


/* =========================
   SEARCH
========================= */

async function performSearch() {

  const q =
    queryInput.value.trim();


  if (!q) {

    queryInput.focus();

    return;

  }


  results.style.display = "block";


  resultList.innerHTML = `
    <div class="loading">
      🔎 HEXORA is searching...
    </div>
  `;


  resultsHeader.textContent =
    `Searching for "${q}"`;


  results.scrollIntoView({
    behavior: "smooth"
  });


  try {

    /* =========================
       SEND SELECTED MODE
    ========================= */

    const response =
      await fetch(
        `/search?q=${encodeURIComponent(q)}&mode=${encodeURIComponent(currentMode)}`
      );


    if (!response.ok) {

      throw new Error(
        "Search request failed"
      );

    }


    const data =
      await response.json();


    const items =
      data.results || [];


    resultsHeader.textContent =
      `${items.length} ${currentMode} results for "${q}"`;


    /* =========================
       NO RESULTS
    ========================= */

    if (!items.length) {

      resultList.innerHTML = `
        <div class="card">

          <h2>
            No ${escapeHtml(currentMode)} results found
          </h2>

          <p
            style="
              color:#9db3c8;
              margin-top:10px;
            "
          >
            HEXORA could not find
            matching indexed ${escapeHtml(currentMode)} results.
          </p>

        </div>
      `;

      return;

    }


    /* =========================
       RESULTS
    ========================= */

    resultList.innerHTML =
      items.map(
        item => `

          <article class="result">

            ${
              currentMode === "images" &&
              item.image_url
              ?
              `
              <img
                src="${escapeHtml(item.image_url)}"
                alt="${escapeHtml(
                  item.title || "HEXORA image"
                )}"
                loading="lazy"
                style="
                  width:180px;
                  height:120px;
                  object-fit:cover;
                  border-radius:12px;
                  margin-bottom:12px;
                  display:block;
                  border:1px solid #16496b;
                "
              >
              `
              :
              ""
            }


            <a
              href="${escapeHtml(item.url || "#")}"
              target="_blank"
              rel="noopener"
            >
              ${escapeHtml(
                item.title ||
                item.url ||
                "Untitled"
              )}
            </a>


            <div class="resultUrl">
              ${escapeHtml(
                item.url || ""
              )}
            </div>


            <p>
              ${escapeHtml(
                item.description ||
                item.content?.slice(0, 300) ||
                "No description available."
              )}
            </p>

          </article>

        `
      ).join("");


  }

  catch (error) {

    console.error(error);


    resultList.innerHTML = `
      <div class="card">

        <h2>
          Search temporarily unavailable
        </h2>

        <p
          style="
            color:#9db3c8;
            margin-top:10px;
          "
        >
          Please try again.
        </p>

      </div>
    `;

  }

}


/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>
