<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HEXORA — Search the World</title>
  <meta name="description" content="HEXORA Search — Search the World">

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #202124;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #eee;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav button {
      border: 0;
      background: transparent;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav button:hover {
      background: #f2f3f5;
    }

    .hero {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 18px 35px;
      text-align: center;
    }

    .hero-inner {
      width: min(850px, 100%);
    }

    .hero-title {
      font-size: clamp(42px, 9vw, 82px);
      font-weight: 900;
      letter-spacing: -3px;
      margin: 0;
    }

    .tagline {
      margin: 10px 0 28px;
      color: #666;
      letter-spacing: 3px;
      font-size: 14px;
    }

    .search-box {
      width: min(760px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      border: 1px solid #d9d9d9;
      border-radius: 32px;
      padding: 6px 7px 6px 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      background: #fff;
    }

    .search-box:focus-within {
      border-color: #999;
      box-shadow: 0 3px 18px rgba(0,0,0,.12);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 12px 8px;
      font-size: 17px;
      background: transparent;
    }

    .search-box button {
      border: 0;
      border-radius: 25px;
      padding: 11px 20px;
      cursor: pointer;
      background: #111;
      color: #fff;
      font-weight: 700;
    }

    .modes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
    }

    .mode-btn,
    .trend-btn,
    .quick-btn {
      border: 1px solid #ddd;
      background: #fff;
      padding: 9px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .mode-btn:hover,
    .trend-btn:hover,
    .quick-btn:hover {
      background: #f5f5f5;
    }

    .section {
      width: min(1100px, 94%);
      margin: 0 auto 40px;
    }

    .section h2 {
      margin-bottom: 16px;
    }

    .trending {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #newsList {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .news-card {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .news-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .news-card-content {
      padding: 15px;
    }

    .news-source {
      color: #777;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .news-card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .news-card p {
      color: #666;
      line-height: 1.5;
      margin: 0 0 8px;
      font-size: 14px;
    }

    .news-card small {
      color: #888;
    }

    .feature-card {
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 20px;
      margin-top: 25px;
    }

    #mapPreview {
      width: 100%;
      height: 280px;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 15px;
    }

    .map-preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    #searchView {
      display: none;
      width: min(950px, 94%);
      margin: 30px auto;
    }

    #searchView.active {
      display: block;
    }

    #results {
      margin-top: 20px;
    }

    .search-result {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }

    .result-source {
      color: #666;
      font-size: 13px;
    }

    .result-title {
      margin: 5px 0;
      font-size: 21px;
    }

    .result-title a {
      color: #1558d6;
    }

    .result-url {
      color: #188038;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .result-description {
      color: #555;
      line-height: 1.55;
    }

    .result-date {
      color: #888;
      font-size: 12px;
    }

    .search-loading,
    .search-error,
    .search-empty {
      padding: 35px 0;
      text-align: center;
      color: #666;
    }

    #mapView {
      display: none;
      position: relative;
      width: 100%;
      min-height: 700px;
      background: #eee;
    }

    #mapView.active {
      display: block;
    }

    #hexoraMap {
      width: 100%;
      height: 700px;
    }

    .map-search-panel {
      position: absolute;
      z-index: 50;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 92%);
      display: flex;
      gap: 7px;
      padding: 7px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 3px 18px rgba(0,0,0,.2);
    }

    .map-search-panel input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 12px;
    }

    .map-search-panel button {
      border: 0;
      background: #111;
      color: #fff;
      border-radius: 9px;
      padding: 0 16px;
      cursor: pointer;
    }

    .map-tools {
      position: absolute;
      z-index: 50;
      left: 16px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .map-tools button {
      border: 0;
      background: #fff;
      border-radius: 9px;
      padding: 10px 13px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .map-info {
      display: none;
      position: absolute;
      z-index: 50;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      padding: 10px 15px;
      border-radius: 9px;
      box-shadow: 0 2px 10px rgba(0,0,0,.2);
      max-width: 90%;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
    }

    @media (max-width: 750px) {
      .header {
        padding: 0 13px;
      }

      .nav button {
        display: none;
      }

      .hero {
        min-height: 330px;
        padding-top: 45px;
      }

      .hero-title {
        letter-spacing: -2px;
      }

      #newsList {
        grid-template-columns: 1fr;
      }

      #hexoraMap {
        height: 620px;
      }

      .search-box button {
        padding: 11px 15px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo" data-home>HEXORA</div>

  <nav class="nav">
    <button data-mode="web">Web</button>
    <button data-mode="images">Images</button>
    <button data-mode="news">News</button>
    <button data-mode="maps">Maps</button>
    <button data-mode="videos">Videos</button>
    <button data-mode="shopping">Shopping</button>
  </nav>
</header>


<main id="homeView">

  <section class="hero">
    <div class="hero-inner">

      <h1 class="hero-title">HEXORA</h1>

      <div class="tagline">
        SEARCH THE WORLD
      </div>

      <form id="searchForm" class="search-box">
        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Search the web..."
        >

        <button type="submit">
          Search
        </button>
      </form>

      <div class="modes">
        <button class="mode-btn" data-mode="web">Web</button>
        <button class="mode-btn" data-mode="images">Images</button>
        <button class="mode-btn" data-mode="news">News</button>
        <button class="mode-btn" data-mode="maps">Maps</button>
        <button class="mode-btn" data-mode="videos">Videos</button>
        <button class="mode-btn" data-mode="shopping">Shopping</button>
      </div>

    </div>
  </section>


  <section class="section">
    <h2>Trending</h2>

    <div class="trending">
      <button class="trend-btn" data-trending="Assam news">
        Assam News
      </button>

      <button class="trend-btn" data-trending="India news">
        India News
      </button>

      <button class="trend-btn" data-trending="AI">
        AI
      </button>

      <button class="trend-btn" data-trending="Python">
        Python
      </button>

      <button class="trend-btn" data-trending="Cricket">
        Cricket
      </button>
    </div>
  </section>


  <section class="section">
    <h2>Latest News</h2>

    <div id="newsList">
      <div class="news-empty">
        Loading news...
      </div>
    </div>
  </section>


  <section class="section">
    <div class="feature-card">

      <h2>HEXORA Map</h2>

      <p>
        Search places, view satellite imagery and use your
        device location.
      </p>

      <div id="mapPreview"></div>

      <div class="map-preview-actions">
        <button id="mapPreviewBtn" class="quick-btn">
          Open HEXORA Map
        </button>

        <button id="openMapBtn" class="quick-btn">
          Explore Map
        </button>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" data-quick="location">
          My Location
        </button>

        <button class="quick-btn" data-quick="place">
          Search Place
        </button>

        <button class="quick-btn" data-quick="directions">
          Directions
        </button>

        <button class="quick-btn" data-quick="satellite">
          Satellite
        </button>
      </div>

    </div>
  </section>

</main>


<section id="searchView">

  <div id="resultMeta">
    Search results
  </div>

  <div id="results"></div>

</section>


<section id="mapView">

  <form class="map-search-panel">

    <input
      id="mapSearchInput"
      type="search"
      autocomplete="off"
      placeholder="Search a place..."
    >

    <button id="mapSearchBtn" type="submit">
      Search
    </button>

  </form>

  <div id="mapInfo" class="map-info"></div>

  <div id="hexoraMap"></div>

  <div class="map-tools">

    <button id="locateBtn">
      📍 My Location
    </button>

    <button id="resetMapBtn">
      ↺ Reset
    </button>

    <button id="fullscreenMapBtn">
      ⛶ Fullscreen
    </button>

  </div>

</section>


<script src="/main.js"></script>

</body>
</html>
