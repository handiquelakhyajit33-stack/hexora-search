name: Extract HEXORA Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          zips = list(Path(".").glob("*.zip"))

          if not zips:
              raise SystemExit("ZIP file not found")

          zip_file = zips[0]
          print("Extracting:", zip_file)

          with zipfile.ZipFile(zip_file, "r") as z:
              z.extractall("extracted")

          root = Path("extracted")

          for item in root.iterdir():
              target = Path(item.name)

              if target.exists():
                  if target.is_dir():
                      import shutil
                      shutil.copytree(item, target, dirs_exist_ok=True)
                  else:
                      import shutil
                      shutil.copy2(item, target)
              else:
                  item.rename(target)

          zip_file.unlink()

          import shutil
          shutil.rmtree("extracted", ignore_errors=True)

          print("HEXORA project extracted successfully.")
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract HEXORA project" || echo "Nothing to commit"
          git push
